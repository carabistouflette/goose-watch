name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain
          key: goose-${{ runner.os }}-${{ hashFiles('GOOSE_REVISION', 'scripts/setup-goose.sh') }}
      - run: make setup
      - run: make check test test-debug test-examples CC=${{ matrix.cc }}
      - run: make test-native CC=${{ matrix.cc }}
      - run: make test-sanitize SANITIZER_CC=${{ matrix.cc }}
      - run: make fuzz FUZZ_RUNS=50000
        if: matrix.cc == 'clang'
      - run: make bench-smoke CC=${{ matrix.cc }}
